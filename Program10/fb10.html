<html>
<body>
<h2>Feedback Form</h2>
<form action="/submit_feedback" method="POST">
Name:
<input type="text" name="name" required><br><br>
Email:
<input type="text" name="email">
<br><br>
Rate our service:<br>
<input type="radio" name="rate" value="Excellent">Excellent<br>
<input type="radio" name="rate" value="Good">Good<br>
<input type="radio" name="rate" value="Average">Average<br>
<input type="radio" name="rate" value="Poor">Poor
<br><br>
Your Feedback:<br>
<textarea name="feedback" rows="5" cols="30"></textarea>
<br><br>
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</form>
</body>
</html>
